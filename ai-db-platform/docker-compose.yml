version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: aidb_postgres
    environment:
      POSTGRES_DB: ai_db_platform
      POSTGRES_USER: aidbuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aidbuser -d ai_db_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aidb_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: aidb_backend
    env_file: ./backend/.env
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    container_name: aidb_ai_service
    env_file: ./ai-service/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379
    ports:
      - '8000:8000'
    volumes:
      - ./ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aidb_frontend
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
