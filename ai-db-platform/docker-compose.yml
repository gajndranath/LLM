version: '3.8'

services:
  # The unified reverse proxy acting as the main entrypoint
  nginx:
    image: nginx:alpine
    container_name: atlas_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas_frontend
    environment:
      - VITE_API_URL=/api
    # It exposes 80 internally, nginx routes traffic to it.
    
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas_backend
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost
    # Nginx routes /api/ to backend:3001
    
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: atlas_ai_service
    env_file:
      - ./ai-service/.env
    # Nginx routes /ai/ to ai-service:8000
